# Full SFT smoke config: minimal steps to validate end-to-end pipeline

### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
pure_bf16: true

### dataset
dataset_dir: /home/algo/video_agent_group/qianqian/glamdring/data
dataset: mmlu_mcq_train
eval_dataset: mmlu_mcq_eval
template: default
cutoff_len: 512
max_samples: 10
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: /home/algo/video_agent_group/qianqian/glamdring/outputs/sft_full_smoke
logging_steps: 1
save_steps: 10
save_total_limit: 2
report_to: tensorboard
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 1.0
max_steps: 20
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
fp16: false
gradient_checkpointing: true

### eval
do_eval: true
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 10
