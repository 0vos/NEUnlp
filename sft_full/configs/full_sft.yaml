### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
pure_bf16: true

### dataset
dataset_dir: /home/algo/video_agent_group/qianqian/glamdring/data
dataset: mmlu_mcq_train
eval_dataset: mmlu_mcq_eval
template: qwen
cutoff_len: 1024
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: /home/algo/video_agent_group/qianqian/glamdring/outputs/sft_full
logging_steps: 10
save_steps: 200
save_total_limit: 3
report_to: tensorboard
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
fp16: false
gradient_checkpointing: true

### eval
do_eval: true
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200
