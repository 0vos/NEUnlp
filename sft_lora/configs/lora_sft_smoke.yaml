# Smoke-test LoRA SFT config (tiny run to validate pipeline)

### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora

### lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset_dir: /home/algo/video_agent_group/qianqian/glamdring/data
dataset: mmlu_mcq_train
eval_dataset: mmlu_mcq_eval
template: default
cutoff_len: 512
max_samples: 200
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: /home/algo/video_agent_group/qianqian/glamdring/outputs/sft_lora_smoke
logging_steps: 5
save_steps: 20
save_total_limit: 2
report_to: tensorboard
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 1.0
max_steps: 20
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
fp16: false
gradient_checkpointing: true

### eval
do_eval: true
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 10
